  parameters:
    id:
      name: id
      in: path
      required: true
      schema: *id008
    q:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
      description: Title search
    category:
      name: category
      in: query
      schema:
        type: string
        enum:
        - books_notes
        - electronics
        - stationery
        - lab_equipment
        - furniture
        - clothing
        - sports
        - other
    type:
      name: type
      in: query
      schema:
        type: string
        enum: *id011
    free:
      name: free
      in: query
      schema:
        type: boolean
    hidden:
      name: hidden
      in: query
      schema:
        type: boolean
    status:
      name: status
      in: query
      schema:
        type: string
        enum: *id013
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
      description: Opaque signed cursor; use nextCursor from previous response
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: uc_session
      description: Opaque HttpOnly server session; set by login. Use credentials include.
    csrfHeader:
      type: apiKey
      in: header
      name: x-csrf-token
      description: CSRF token from GET /auth/csrf or authenticated login response. Origin is also validated.

              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:

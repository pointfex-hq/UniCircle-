components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          required:
          - code
          - message
          - details
      required:
      - error
    UserSelf:
      type: object
      additionalProperties: false
      properties:
        id: &id008
          type: string
          pattern: ^[a-f0-9]{24}$
        fullName:
          type: string
        displayName:
          type: string
        universityEmail:
          type: string
          format: email
        role:
          type: string
          enum:
          - member
          - admin
        verificationStatus:
          type: string
          enum:
          - unverified
          - verified
      required:
      - id
      - fullName
      - displayName
      - universityEmail
      - role
      - verificationStatus
    OwnerPublic:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        displayName:
          type: string
      required:
      - id
      - displayName
    Category:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        code:
          type: string
          enum:
          - books_notes
          - electronics
          - stationery
          - lab_equipment
          - furniture
          - clothing
          - sports
          - other
        name:
          type: string
      required:
      - id
      - code
      - name
    Domain:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        domain:
          type: string
        isActive:
          type: boolean
        createdAt: &id009
          type: string
          format: date-time
        updatedAt: *id009
      required:
      - id
      - domain
      - isActive
      - createdAt
      - updatedAt
    ListingSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        condition:
          type: string
          enum: &id010
          - new
          - like_new
          - good
          - fair
          - poor
        listingType:
          type: string
          enum: &id011
          - sell
          - donate
          - rent
          - exchange
          - free_borrowing
        amountBdt:
          anyOf:
          - &id012
            type: string
            pattern: ^(0|[1-9][0-9]{0,6})\.[0-9]{2}$
          - type: 'null'
        exchangeTerms:
          anyOf:
          - type: string
          - type: 'null'
        photoUrl:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        owner:
          $ref: '#/components/schemas/OwnerPublic'
        status:
          type: string
          enum: &id013
          - available
          - reserved
          - checked_out
          - completed
          - closed
        createdAt: *id009
      required:
      - id
      - title
      - category
      - condition
      - listingType
      - amountBdt
      - exchangeTerms
      - photoUrl
      - owner
      - status
      - createdAt
    ListingDetail:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        title:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        condition:
          type: string
          enum: *id010
        listingType:
          type: string
          enum: *id011
        amountBdt:
          anyOf:
          - *id012
          - type: 'null'
        exchangeTerms:
          anyOf:
          - type: string
          - type: 'null'
        photoUrl:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        owner:
          $ref: '#/components/schemas/OwnerPublic'
        status:
          type: string
          enum: *id013
        createdAt: *id009
        description:
          type: string
        version:
          type: integer
          minimum: 1
        isHidden:
          type: boolean
        hiddenReason:
          anyOf:
          - type: string
          - type: 'null'
        updatedAt: *id009
      required:
      - id
      - title
      - category
      - condition
      - listingType
      - amountBdt
      - exchangeTerms
      - photoUrl
      - owner
      - status
      - createdAt
      - description
      - version
      - isHidden
      - updatedAt
      description: hiddenReason only for owner; omit it for non-owner.
    RequestDetail:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        listingId: *id008
        requester:
          $ref: '#/components/schemas/OwnerPublic'
        listingType:
          type: string
          enum: *id011
        status:
          type: string
          enum:
          - pending
          - accepted
          - declined
          - cancelled
          - checked_out
          - completed
        termsAmountBdt:
          anyOf:
          - *id012
          - type: 'null'
        listingExchangeTerms:
          anyOf:
          - type: string
          - type: 'null'
        proposedPickupDate:
          anyOf:
          - &id014
            type: string
            pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          - type: 'null'
        returnDate:
          anyOf:
          - *id014
          - type: 'null'
        rentalFeeBdt:
          anyOf:
          - *id012
          - type: 'null'
        offeredItemDescription:
          anyOf:
          - type: string
          - type: 'null'
        pickupPoint:
          anyOf:
          - type: string
          - type: 'null'
        pickupAt:
          anyOf:
          - *id009
          - type: 'null'
        handedOverAt:
          anyOf:
          - *id009
          - type: 'null'
        returnedAt:
          anyOf:
          - *id009
          - type: 'null'
        cancellationReason:
          anyOf:
          - type: string
          - type: 'null'
        createdAt: *id009
      required:
      - id
      - listingId
      - requester
      - listingType
      - status
      - termsAmountBdt
      - listingExchangeTerms
      - proposedPickupDate
      - returnDate
      - rentalFeeBdt
      - offeredItemDescription
      - createdAt
      description: pickupPoint/pickupAt only owner and this requester; never admin of unrelated transaction.
    AdminListing:
      type: object
      additionalProperties: false
      properties:
        id: *id008
        title:
          type: string
        listingType:
          type: string
          enum: *id011
        status:
          type: string
          enum: *id013
        isHidden:
          type: boolean
        hiddenReason:
          anyOf:
          - type: string
          - type: 'null'
        owner:
          $ref: '#/components/schemas/OwnerPublic'
        createdAt: *id009
      required:
      - id
      - title
      - listingType
      - status
      - isHidden
      - owner
      - createdAt
      description: Never includes private pickup, passwords, account email.
    CreateListing:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          title: &id015
            type: string
            minLength: 3
            maxLength: 100
          categoryId: *id008
          description: &id016
            type: string
            minLength: 10
            maxLength: 2000
          condition: &id017
            type: string
            enum: *id010
          photoAssetId: *id008
          listingType:
            type: string
            const: sell
          amountBdt: *id012
        required:
        - title
        - categoryId
        - description
        - condition
        - listingType
        - amountBdt
        description: Paid sale; amount > 0 checked server-side.
      - type: object
        additionalProperties: false
        properties:
          title: *id015
          categoryId: *id008
          description: *id016
          condition: *id017
          photoAssetId: *id008
          listingType:
            type: string
            const: rent
          amountBdt: *id012
        required:
        - title
        - categoryId
        - description
        - condition
        - listingType
        - amountBdt
        description: Paid daily rent; amount > 0 checked server-side.
      - type: object
        additionalProperties: false
        properties:
          title: *id015
          categoryId: *id008
          description: *id016
          condition: *id017
          photoAssetId: *id008
          listingType:
            type: string
            const: donate
          amountBdt: *id012
        required: &id018
        - title
        - categoryId
        - description
        - condition
        - listingType
        description: No amount or explicit 0.00 only, checked server-side.
      - type: object
        additionalProperties: false
        properties:
          title: *id015
          categoryId: *id008
          description: *id016
          condition: *id017
          photoAssetId: *id008
          listingType:
            type: string
            const: free_borrowing
          amountBdt: *id012
        required: *id018
        description: No amount or explicit 0.00 only, checked server-side.
      - type: object
        additionalProperties: false
        properties:
          title: *id015
          categoryId: *id008
          description: *id016
          condition: *id017
          photoAssetId: *id008
          listingType:
            type: string
            const: exchange
          exchangeTerms:
            type: string
            minLength: 1
            maxLength: 500
        required:
        - title
        - categoryId
        - description
        - condition
        - listingType
        - exchangeTerms
        description: No money amount for exchange.
      description: ' Server validates type-specific fields, positive paid amount, <=9,999,999.99 BDT, and state/date
        invariants in API_CONTRACT.md.'
    PatchListing:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 3
          maxLength: 100
        categoryId: *id008
        description:
          type: string
          minLength: 10
          maxLength: 2000
        condition:
          type: string
          enum: *id010
        listingType:
          type: string
          enum: *id011
        amountBdt: *id012
        exchangeTerms:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
        photoAssetId:
          anyOf:
          - *id008
          - type: 'null'
      required:
      - version
      description: Only allowed keys. Null photoAssetId removes photo. Must have at least one mutable field;
        version mismatch =>409. Server validates type-specific fields, positive paid amount, <=9,999,999.99
        BDT, and state/date invariants in API_CONTRACT.md.
    Register:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        universityEmail:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
      - fullName
      - displayName
      - universityEmail
      - password
    Verify:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 16
      required:
      - token
    EmailOnly:
      type: object
      additionalProperties: false
      properties:
        universityEmail:
          type: string
          format: email
      required:
      - universityEmail
    Login:
      type: object
      additionalProperties: false
      properties:
        universityEmail:
          type: string
          format: email
        password:
          type: string
      required:
      - universityEmail
      - password
    ResetPassword:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 16
        newPassword:
          type: string
          minLength: 8
      required:
      - token
      - newPassword
    CreateRequest:
      oneOf:
      - type: object
        additionalProperties: false
        properties: {}
        description: 'Sell or donate: empty body only.'
      - type: object
        additionalProperties: false
        properties:
          proposedPickupDate: *id014
          returnDate: *id014
        required:
        - proposedPickupDate
        - returnDate
        description: Rent and free borrowing only; enforce date difference 1–365 days.
      - type: object
        additionalProperties: false
        properties:
          offeredItemDescription:
            type: string
            minLength: 1
            maxLength: 500
        required:
        - offeredItemDescription
        description: Exchange only.
      description: ' Server validates type-specific fields, positive paid amount, <=9,999,999.99 BDT, and state/date
        invariants in API_CONTRACT.md.'
    Accept:
      type: object
      additionalProperties: false
      properties:
        pickupPoint:
          type: string
          minLength: 3
          maxLength: 120
        pickupAt: *id009
      required:
      - pickupPoint
      - pickupAt
    Cancel:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    Handover:
      oneOf:
      - type: object
        additionalProperties: false
        properties: {}
        description: Sell, donate, rent and free borrowing.
      - type: object
        additionalProperties: false
        properties:
          confirmBothItemsExchanged:
            type: boolean
            const: true
        required:
        - confirmBothItemsExchanged
        description: Exchange requires true and explicit UI confirmation.
    AddDomain:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string
          minLength: 3
          maxLength: 253
      required:
      - domain
    PatchDomain:
      type: object
      additionalProperties: false
      properties:
        isActive:
          type: boolean
      required:
      - isActive
    HideListing:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
      - reason
    PhotoSignRequest:
      type: object
      additionalProperties: false
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
        sizeBytes:
          type: integer

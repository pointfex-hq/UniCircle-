        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      security:
      - *id002
  /requests/{id}/accept:
    post:
      tags:
      - Requests
      operationId: post_requests_id_accept
      summary: Accept pending request atomically
      description: 'Authorization: Owner+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestWithStatusResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Accept'
      parameters:
      - *id004
      security: *id003
  /requests/{id}/decline:
    post:
      tags:
      - Requests
      operationId: post_requests_id_decline
      summary: Decline pending request
      description: 'Authorization: Owner+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      security: *id003
  /requests/{id}/cancel:
    post:
      tags:
      - Requests
      operationId: post_requests_id_cancel
      summary: Cancel pending or pre-handover accepted request
      description: 'Authorization: Requester/participant+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:

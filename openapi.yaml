openapi: 3.1.0
info:
  title: UniCircle Single-University Marketplace REST API
  version: 3.0.0
  description: Frozen internal API contract aligned with UniCircle PRD v3.0, Supabase Storage Free signed uploads,
    Vercel deployment target and initial seu.edu.bd university domain (2026-11-23). Read API_CONTRACT.md for
    permissions and state invariants. Services are not implemented merely by publishing this spec.
servers:
- url: /api/v1
  description: Same-origin Vercel API base
tags:
- name: Infrastructure
- name: Auth
- name: Listings
- name: Photos
- name: Requests
- name: Activity
- name: Admin
paths:
  /health:
    get:
      tags:
      - Infrastructure
      operationId: get_health
      summary: Health signal
      description: 'Authorization: Public. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/csrf:
    get:
      tags:
      - Auth
      operationId: get_auth_csrf
      summary: CSRF bootstrap
      description: 'Authorization: Public. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
      security: []
  /auth/register:
    post:
      tags:
      - Auth
      operationId: post_auth_register
      summary: Register email-only university member
      description: 'Authorization: Public+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      security: &id001
      - csrfHeader: []
  /auth/verify-email:
    post:
      tags:
      - Auth
      operationId: post_auth_verify_email
      summary: Verify university email link
      description: 'Authorization: Public+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify'
      security: *id001
  /auth/resend-verification:
    post:
      tags:
      - Auth
      operationId: post_auth_resend_verification
      summary: Resend verification email with generic response
      description: 'Authorization: Public+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnly'
      security: *id001
  /auth/login:
    post:
      tags:
      - Auth
      operationId: post_auth_login
      summary: Sign in with university email
      description: 'Authorization: Public+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      security: *id001
  /auth/logout:
    post:
      tags:
      - Auth
      operationId: post_auth_logout
      summary: Logout and revoke session
      description: 'Authorization: Auth+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '204':
          description: No content; no response body.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: &id003
      - cookieAuth: []
        csrfHeader: []
  /auth/me:
    get:
      tags:
      - Auth
      operationId: get_auth_me
      summary: Return own current user
      description: 'Authorization: Auth. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - &id002
        cookieAuth: []
  /verification/status:
    get:
      tags:
      - Auth
      operationId: get_verification_status
      summary: Current email verification state
      description: 'Authorization: Auth. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - *id002
  /auth/forgot-password:
    post:
      tags:
      - Auth
      operationId: post_auth_forgot_password
      summary: Request reset link with generic response
      description: 'Authorization: Public+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '202':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnly'
      security: *id001
  /auth/reset-password:
    post:
      tags:
      - Auth
      operationId: post_auth_reset_password
      summary: Reset password and revoke all sessions
      description: 'Authorization: Public+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPassword'
      security: *id001
  /categories:
    get:
      tags:
      - Listings
      operationId: get_categories
      summary: Get eight immutable categories
      description: 'Authorization: Verified. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - *id002
  /listings:
    get:
      tags:
      - Listings
      operationId: get_listings
      summary: Browse feed cursor pagination
      description: 'Authorization: Verified. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingsPageResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/type'
      - $ref: '#/components/parameters/free'
      - &id005
        $ref: '#/components/parameters/limit'
      - &id006
        $ref: '#/components/parameters/cursor'
      security:
      - *id002
    post:
      tags:
      - Listings
      operationId: post_listings
      summary: Create listing
      description: 'Authorization: Verified+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListing'
      security: *id003
  /listings/{id}:
    get:
      tags:
      - Listings
      operationId: get_listings_id
      summary: Listing detail with visibility rules
      description: 'Authorization: Verified+visibility. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - &id004
        $ref: '#/components/parameters/id'
      security:
      - *id002
    patch:
      tags:
      - Listings
      operationId: patch_listings_id
      summary: Edit available owner listing with version
      description: 'Authorization: Owner+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchListing'
      parameters:
      - *id004
      security: *id003
    delete:
      tags:
      - Listings
      operationId: delete_listings_id
      summary: Soft-delete eligible owner listing
      description: 'Authorization: Owner+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '204':
          description: No content; no response body.
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      security: *id003
  /listings/{id}/close:
    post:
      tags:
      - Listings
      operationId: post_listings_id_close
      summary: Close eligible owner listing
      description: 'Authorization: Owner+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      security: *id003
  /listings/photos/sign:
    post:
      tags:
      - Photos
      operationId: post_listings_photos_sign
      summary: Authorize direct Supabase Storage Free image upload
      description: Verified owner + CSRF; server signs owner-bound generated object key; Supabase signed upload
        TTL 2 hours. Binary is uploaded client-to-Supabase, not via Vercel Function.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoSignResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoSignRequest'
      security: *id003
  /listings/photos/confirm:
    post:
      tags:
      - Photos
      operationId: post_listings_photos_confirm
      summary: Confirm Supabase Storage object and owner-bound photo asset
      description: Verified owner + CSRF; validate actual object bytes/size/MIME/magic and ownership; return
        trusted public URL only after verification.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoConfirmResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Upstream upload failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoConfirmRequest'
      security: *id003
  /listings/{id}/requests:
    post:
      tags:
      - Requests
      operationId: post_listings_id_requests
      summary: Create listing request with immutable term snapshot
      description: 'Authorization: Verified non-owner+CSRF. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden / not verified / CSRF rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or not visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRequest'
      parameters:
      - *id004
      security: *id003
  /requests/{id}:
    get:
      tags:
      - Requests
      operationId: get_requests_id
      summary: Get participant-only private request
      description: 'Authorization: Participant. See API_CONTRACT.md for state and privacy invariants.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400':
          description: Validation error / invalid token
          content:
            application/json:
              schema:
